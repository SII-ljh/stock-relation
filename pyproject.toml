[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-relation"
version = "0.1.0"
description = "沪深300成分股关联关系建模工具包"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "baostock>=0.8.8",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["src*"]
